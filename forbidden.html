<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forbidden Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  /* 단서 쪽지 (양피지 + 잉크) */
  .clue { font-family: "IM Fell English", Georgia, serif; font-size: 2.1rem; line-height: 1.3; margin: 0; }
  .clue .dont { color: #9c1010; font-weight: 700; }
  .listen-big { font-family: "IM Fell English", Georgia, serif; font-size: 2rem; margin: 4px 0; }
  .clue-tools { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .clue-tools button { background: #3a2510; border-color: #a57c3d; color: #fbe7a1; }

  /* 방 안의 물건들: 나무 받침대 + 놋쇠 이름표 */
  .room { display: grid; gap: 18px; margin: 30px auto 10px; max-width: 920px; }
  .room.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .room.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .spot { position: relative; height: 200px; padding: 0; overflow: visible; flex-direction: column; justify-content: flex-end;
    border: 3px solid #8a6416; border-radius: 16px;
    background:
      repeating-linear-gradient(90deg, #ffffff06 0 2px, transparent 2px 14px),
      linear-gradient(180deg, #5a3a1e, #2e1c0c);
    box-shadow: inset 0 0 0 2px #00000055, inset 0 -30px 40px #0007, 0 10px 20px #000a; }
  .spot:hover { border-color: var(--gold-1); }
  .spot .found { position: absolute; bottom: 44px; left: 0; right: 0; font-size: 3.6rem; opacity: 0; transition: opacity .3s; }
  .spot .cover { font-size: 5rem; transition: transform .5s cubic-bezier(.3,1.6,.5,1); position: relative; z-index: 2; margin-bottom: 40px; filter: drop-shadow(0 8px 6px #000a); }
  .spot .name { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 1px 14px; border-radius: 4px;
    font: 800 .95rem "Cinzel", Georgia, serif; color: #2a1a04; background: linear-gradient(180deg, #fff1b5, #c9962f); box-shadow: 0 2px 4px #0008; }
  .spot.open .cover { transform: translateY(-80px) rotate(-14deg); }
  .spot.open .found { opacity: 1; }
  .spot.right { border-color: var(--ok); box-shadow: 0 0 0 3px #5fe39a88, 0 0 36px #5fe39a88; }
  .spot.wrong { opacity: .6; }
  .spot.danger { border-color: var(--bad); box-shadow: 0 0 0 3px #ff6b6b88, 0 0 40px #ff3b3baa; }

  /* 문장 말하기 */
  .ask { font-family: "IM Fell English", Georgia, serif; font-size: 2.4rem; margin: 0; }
  .target { font-family: "Cinzel", Georgia, serif; font-size: 2rem; font-weight: 800; margin: 14px 0 0; color: var(--ink); }
  .target span { padding: 0 3px; border-radius: 6px; }
  .target .hit { color: #13703a; }
  .target .miss { color: #b3161b; text-decoration: underline wavy; }
  .pair { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 5rem; margin: 6px 0; filter: drop-shadow(0 8px 10px #000a); }
  .pair .arrow { font-size: 2.4rem; }

  .alarm { position: fixed; inset: 0; background: #ff000044; pointer-events: none; animation: flash .3s 3; z-index: 50; }
  @keyframes flash { 50% { background: transparent; } }
  @media (max-width: 760px) {
    .room.n4, .room.n6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .spot { height: 160px; } .spot .cover { font-size: 3.6rem; } .clue { font-size: 1.4rem; } .target { font-size: 1.4rem; } .ask { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>🗝️ The Forbidden Room</h1>
  <div class="tools">
    <a class="btn btn-small" href="index.html">🏠 처음으로</a>
    <button class="btn-small" onclick="Magic.toggleFullscreen()">⛶ 전체화면</button>
  </div>
</div>

<main class="wrap center" id="app"></main>

<script src="assets/common.js"></script>
<script>
// 물건을 숨길 장소 (prep = 위치 표현)
const SPOTS = [
  { k: 'book',  e: '📚', prep: 'under' },
  { k: 'box',   e: '📦', prep: 'in' },
  { k: 'bag',   e: '🎒', prep: 'in' },
  { k: 'hat',   e: '🎩', prep: 'under' },
  { k: 'chair', e: '🪑', prep: 'under' },
  { k: 'bed',   e: '🛏️', prep: 'under' },
];
// 찾을 물건
const ITEMS = [
  { k: 'key',  e: '🔑' },
  { k: 'wand', e: '🪄' },
  { k: 'ring', e: '💍' },
  { k: 'coin', e: '🪙' },
  { k: 'egg',  e: '🥚' },
  { k: 'frog', e: '🐸' },
];
// 만지면 안 되는 곳에 숨어 있는 것
const DANGERS = [
  { k: 'spider', e: '🕷️' },
  { k: 'snake',  e: '🐍' },
  { k: 'ghost',  e: '👻' },
];
const MISSIONS = 3;
const PASS = 0.7; // 문장 말하기 통과 기준 (70%)

const app = document.getElementById('app');
let level, missions, m, mode, turn = 0;

function home() {
  app.innerHTML = `
    <div class="pop" style="margin-top:18px">
      <div style="font-size:5.5rem;filter:drop-shadow(0 0 24px #ffd25a88)">🚪🗝️</div>
      <h2 class="title" style="font-size:3rem">The Forbidden Room</h2>
      <p class="speech" style="margin:4px 0">“Listen carefully. Find the magic things.<br><span style="color:#ff8a8a">But don't touch the dangerous things!</span>”</p>
      <p class="ko">영어 단서를 잘 듣고 물건을 찾은 뒤, 어디에 있었는지 영어 문장으로 말해요. (미션 ${MISSIONS}개)</p>
      <div class="parchment" style="max-width:820px;margin-top:30px">
        <div class="level-grid">
          <button class="opt level" data-l="beginner"><span class="medal">📜</span>Beginner<span class="ko">단서 글자 보기 (3~4학년)</span></button>
          <button class="opt level" data-l="advanced"><span class="medal">👂</span>Advanced<span class="ko">듣기만으로 도전 (5~6학년)</span></button>
        </div>
        <div class="seal">F</div>
      </div>
    </div>`;
  Magic.micNotice(app);
  app.querySelectorAll('.level').forEach(b => b.onclick = () => start(b.dataset.l));
  Magic.speak("Welcome to the Forbidden Room. Listen carefully. But don't touch the dangerous things!");
}

function makeMissions() {
  const n = level === 'beginner' ? 4 : 6;
  const items = Magic.shuffle(ITEMS);
  return Array.from({ length: MISSIONS }, (_, i) => {
    const spots = Magic.shuffle(SPOTS).slice(0, n);
    const target = spots[0], forbidden = spots[1];
    return {
      spots: Magic.shuffle(spots),
      target, forbidden,
      item: items[i % items.length],
      danger: DANGERS[Math.floor(Math.random() * DANGERS.length)],
    };
  });
}

function start(l) {
  level = l; missions = makeMissions(); m = 0;
  Magic.sfx.magic();
  findStep();
}

function clueText(M) {
  return {
    find: `Find the ${M.item.k}.`,
    where: `The ${M.item.k} is ${M.target.prep} the ${M.target.k}.`,
    dont: `Don't touch the ${M.forbidden.k}!`,
  };
}

function findStep() {
  mode = 'find'; turn++;
  const M = missions[m];
  const c = clueText(M);
  const showText = level === 'beginner';
  app.innerHTML = `
    <div class="pill" style="margin-top:6px">Mission ${m + 1} / ${MISSIONS}</div>
    <div class="parchment pop" style="max-width:820px;margin-top:20px">
      <div class="clue ${showText ? '' : 'hidden'}" id="clue">
        🔎 ${c.find} ${c.where}<br><span class="dont">🚫 ${c.dont}</span>
      </div>
      <div id="clueHidden" class="listen-big ${showText ? 'hidden' : ''}">👂 Listen to the clue!</div>
      <div class="clue-tools">
        <button class="btn-small" id="again">🔊 Listen again</button>
        ${showText ? '' : '<button class="btn-small" id="show">📜 Show clue</button>'}
      </div>
    </div>
    <div class="room n${M.spots.length}">
      ${M.spots.map(s => `
        <button class="spot" data-k="${s.k}">
          <span class="found">${s === M.target ? M.item.e : s === M.forbidden ? M.danger.e : '💨'}</span>
          <span class="cover">${s.e}</span>
          <span class="name">${s.k}</span>
        </button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="teacher">
      <div class="label">선생님용</div>
      <div class="row"><button class="btn-small" id="skip">➜ 정답 보여주기</button></div>
    </div>`;
  const read = () => Magic.speak(`${c.find} ${c.where} ${c.dont}`, { rate: level === 'beginner' ? 0.8 : 0.9 });
  read();
  document.getElementById('again').onclick = read;
  const show = document.getElementById('show');
  if (show) show.onclick = () => { document.getElementById('clue').classList.remove('hidden'); document.getElementById('clueHidden').classList.add('hidden'); };
  document.getElementById('skip').onclick = () => tapSpot(M.target.k);
  app.querySelectorAll('.spot').forEach(b => b.onclick = () => tapSpot(b.dataset.k));
}

function tapSpot(k) {
  if (mode !== 'find') return;
  const M = missions[m];
  const el = app.querySelector(`.spot[data-k="${k}"]`);
  const fb = document.getElementById('fb');
  if (el.classList.contains('open')) return;
  el.classList.add('open');
  if (k === M.target.k) {
    mode = 'found';
    el.classList.add('right');
    fb.className = 'feedback ok'; fb.textContent = `✨ You found the ${M.item.k}! ✨`;
    Magic.sfx.ok(); Magic.sparkle(el);
    Magic.speak(`You found the ${M.item.k}!`).then(() => setTimeout(sayStep, 500));
  } else if (k === M.forbidden.k) {
    el.classList.add('danger');
    fb.className = 'feedback bad'; fb.textContent = `😱 Oh no! A ${M.danger.k}! Don't touch the ${k}!`;
    Magic.sfx.alarm();
    const a = document.createElement('div'); a.className = 'alarm'; document.body.appendChild(a); setTimeout(() => a.remove(), 1000);
    Magic.shake(app.querySelector('.room'));
    Magic.inc('forbidden_touched');
    Magic.speak(`Oh no! A ${M.danger.k}! Don't touch the ${k}!`);
  } else {
    el.classList.add('wrong');
    fb.className = 'feedback bad'; fb.textContent = 'Not here! Try again.';
    Magic.sfx.bad();
    Magic.speak('Not here! Try again.');
  }
}

function sayStep() {
  mode = 'say'; turn++;
  const M = missions[m];
  const target = clueText(M).where;
  const blanks = level === 'advanced';
  const shown = blanks
    ? `The <u>&nbsp;?&nbsp;</u> is <u>&nbsp;?&nbsp;</u> the <u>&nbsp;?&nbsp;</u>.`
    : target;
  app.innerHTML = `
    <div class="pill" style="margin-top:6px">Mission ${m + 1} / ${MISSIONS}</div>
    <div class="pair pop">${M.item.e}<span class="arrow">${M.target.prep === 'in' ? '➡️' : '⬇️'}</span>${M.target.e}</div>
    <div class="parchment" style="max-width:820px">
      <div class="q-head"><h2 class="ask">Where is the ${M.item.k}?</h2><button class="speak-btn" id="ask" aria-label="다시 듣기">🔊</button></div>
      <div class="ko">물건이 어디에 있었는지 문장으로 말해 보세요.</div>
      <div class="target" id="target">${shown}</div>
      <div class="seal">F</div>
    </div>
    <div class="listen-row" style="margin-top:22px">
      <button class="mic" id="mic" aria-label="말하기">🎤</button>
      <button class="speak-btn" id="model" aria-label="정답 듣기">👂</button>
    </div>
    <div class="heard" id="heard">🎤를 누르고 문장으로 말해 보세요. <span class="ko">(👂 정답 문장 듣기)</span></div>
    <div class="feedback" id="fb"></div>
    <div class="teacher">
      <div class="label">선생님용</div>
      <div class="row"><button class="btn-small btn-ok" id="pass">✔ 통과</button></div>
    </div>`;
  const ask = () => Magic.speak(`Where is the ${M.item.k}?`);
  ask();
  document.getElementById('ask').onclick = ask;
  document.getElementById('model').onclick = () => { document.getElementById('target').textContent = target; Magic.speak(target, { rate: 0.75 }); };
  document.getElementById('pass').onclick = () => passed(target);
  const mic = document.getElementById('mic');
  if (!Magic.canListen) mic.disabled = true;
  let busy = false;
  mic.onclick = async () => {
    if (busy) return;
    busy = true;
    const my = turn;
    const heard = document.getElementById('heard');
    const fb = document.getElementById('fb');
    mic.classList.add('listening'); heard.textContent = 'Listening... 🎧'; fb.textContent = '';
    try {
      const said = await Magic.listen({ timeout: 8000 });
      if (my !== turn) return;
      mic.classList.remove('listening'); busy = false;
      heard.innerHTML = said.length ? `I heard: <b>${said[0]}</b>` : '잘 안 들렸어요. 조금 더 크게!';
      if (!said.length) return;
      const r = Magic.scoreSentence(said, target, [M.item.k, M.target.prep, M.target.k]);
      document.getElementById('target').innerHTML = r.words.map((w, i) => `<span class="${r.hit[i] ? 'hit' : 'miss'}">${w}</span>`).join(' ');
      if (r.score >= PASS) passed(target);
      else {
        fb.className = 'feedback bad'; fb.textContent = 'Almost! Try again.';
        Magic.sfx.bad();
      }
    } catch (e) {
      mic.classList.remove('listening'); busy = false;
      heard.textContent = '마이크 오류: 선생님이 ✔ 통과로 진행해 주세요.';
    }
  };
}

function passed(target) {
  if (mode !== 'say') return;
  mode = 'done'; turn++;
  Magic.stopListening();
  document.getElementById('mic').classList.remove('listening');
  document.getElementById('target').innerHTML = `<span class="hit">${target}</span>`;
  const fb = document.getElementById('fb');
  fb.className = 'feedback ok'; fb.textContent = '✨ Perfect! ✨';
  Magic.sfx.ok(); Magic.sparkle(document.getElementById('target'));
  Magic.inc('room_missions');
  Magic.speak(`Perfect! ${target}`).then(() => setTimeout(() => {
    m++;
    m < MISSIONS ? findStep() : finish();
  }, 400));
}

function finish() {
  Magic.inc('room_players');
  app.innerHTML = `
    <div class="pop" style="margin-top:18px">
      <div class="parchment" style="max-width:640px;margin-top:24px">
        <div style="font-size:5rem">🗝️🏆</div>
        <h2 class="q-text">Mission Complete!</h2>
        <p class="fell" style="font-size:1.6rem;margin:6px 0">You escaped the Forbidden Room!</p>
        <p class="ko">마지막 미션 Final Spell(컵 쌓기)로 이동하세요! ➜</p>
        <div class="seal">F</div>
      </div>
      <button class="btn-magic" id="again" style="margin-top:36px">🚪 Next Student</button>
    </div>`;
  Magic.sfx.magic(); Magic.confetti(); Magic.sparkle(app.querySelector('.parchment'));
  Magic.speak('Mission complete! You escaped the Forbidden Room! Now, go to the Final Spell!');
  document.getElementById('again').onclick = home;
}

home();
</script>
</body>
</html>
