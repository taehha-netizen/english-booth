<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  /* 별 진행 표시 */
  .stars { font-size: 2rem; letter-spacing: 6px; margin: 4px 0 6px; }
  .stars span { filter: drop-shadow(0 0 8px #ffd25a); }
  .stars .off { opacity: .2; filter: grayscale(1); }

  /* 수정 구슬 */
  .orb-wrap { position: relative; width: 300px; margin: 6px auto 0; }
  .orb { width: 260px; height: 260px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
    background:
      radial-gradient(circle at 32% 26%, #ffffffaa 0 6%, transparent 18%),
      radial-gradient(circle at 50% 55%, #6d5bd0 0%, #2c1f6e 55%, #120b38 100%);
    box-shadow: 0 0 0 4px #ffffff22, 0 0 50px #8a7cff88, inset 0 -20px 40px #0008; }
  .orb .e { font-size: 8rem; filter: drop-shadow(0 6px 10px #000a); }
  .orb.cast { animation: cast .9s ease-out; }
  @keyframes cast { 0% { box-shadow: 0 0 0 4px #fff4, 0 0 50px #8a7cff88; } 40% { box-shadow: 0 0 0 10px #fbe7a1, 0 0 120px #ffd25a; } 100% { box-shadow: 0 0 0 4px #ffffff22, 0 0 50px #8a7cff88; } }
  .orb-stand { width: 190px; height: 46px; margin: -26px auto 0; border-radius: 8px 8px 30px 30px;
    background: linear-gradient(180deg, #fff1b5, #b8862a 45%, #5a3d0c); box-shadow: 0 10px 20px #000a; }

  .q-line { font-family: "IM Fell English", Georgia, serif; font-size: 2.2rem; margin: 14px 0 0; }
  .word-box { min-height: 1.6em; font-family: "Cinzel", Georgia, serif; font-size: 2.6rem; font-weight: 800; letter-spacing: .14em; color: var(--gold-1); text-shadow: 0 0 18px #ffcc5a88; }
  .help-row { display: flex; gap: 12px; justify-content: center; }

  @media (max-width: 640px) {
    .orb-wrap { width: 220px; } .orb { width: 190px; height: 190px; } .orb .e { font-size: 5.6rem; } .orb-stand { width: 140px; }
    .q-line { font-size: 1.6rem; } .word-box { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>🪄 Spell Challenge</h1>
  <div class="tools">
    <a class="btn btn-small" href="index.html">🏠 처음으로</a>
    <button class="btn-small" onclick="Magic.toggleFullscreen()">⛶ 전체화면</button>
  </div>
</div>

<main class="wrap center" id="app"></main>

<script src="assets/common.js"></script>
<script>
// 단어 목록: accept = 아이 발음/인식 오차를 감안해 정답으로 인정할 말
const WORDS = {
  beginner: [
    { w: 'owl', e: '🦉', accept: ['owl', 'owls', 'howl', 'al', 'all', 'oul', 'hole'] },
    { w: 'wand', e: '🪄', accept: ['wand', 'wands', 'want', 'wants', 'won', 'wan'] },
    { w: 'broom', e: '🧹', accept: ['broom', 'brooms', 'brume', 'brum', 'groom'] },
    { w: 'cat', e: '🐱', accept: ['cat', 'cats', 'kat', 'kitty'] },
    { w: 'key', e: '🔑', accept: ['key', 'keys', 'ki', 'kee', 'kiki'] },
    { w: 'book', e: '📕', accept: ['book', 'books', 'buck'] },
    { w: 'hat', e: '🎩', accept: ['hat', 'hats', 'had', 'hut'] },
    { w: 'frog', e: '🐸', accept: ['frog', 'frogs', 'frock', 'fog'] },
    { w: 'moon', e: '🌙', accept: ['moon', 'moons', 'mood'] },
    { w: 'star', e: '⭐', accept: ['star', 'stars', 'stop'] },
    { w: 'cup', e: '🥤', accept: ['cup', 'cups', 'cop', 'cap'] },
    { w: 'box', e: '📦', accept: ['box', 'boxes', 'books', 'fox'] },
  ],
  advanced: [
    { w: 'wizard', e: '🧙', accept: ['wizard', 'wizards', 'wizzard', 'lizard'] },
    { w: 'dragon', e: '🐉', accept: ['dragon', 'dragons', 'drag on'] },
    { w: 'castle', e: '🏰', accept: ['castle', 'castles', 'cassel', 'kasel'] },
    { w: 'potion', e: '🧪', accept: ['potion', 'potions', 'portion', 'motion', 'ocean'] },
    { w: 'ghost', e: '👻', accept: ['ghost', 'ghosts', 'goes', 'gost', 'host'] },
    { w: 'spider', e: '🕷️', accept: ['spider', 'spiders'] },
    { w: 'candle', e: '🕯️', accept: ['candle', 'candles', 'kendall', 'can dull'] },
    { w: 'letter', e: '✉️', accept: ['letter', 'letters', 'ladder', 'later'] },
    { w: 'map', e: '🗺️', accept: ['map', 'maps', 'mop', 'nap'] },
    { w: 'crown', e: '👑', accept: ['crown', 'crowns', 'clown', 'brown'] },
    { w: 'unicorn', e: '🦄', accept: ['unicorn', 'unicorns', 'unicon'] },
    { w: 'snake', e: '🐍', accept: ['snake', 'snakes', 'snack', 'stake'] },
  ],
};
const ROUND = 5;

const app = document.getElementById('app');
let level, list, idx, success, tries, busy = false, turn = 0;

function home() {
  app.innerHTML = `
    <div class="pop" style="margin-top:18px">
      <div style="font-size:5.5rem;filter:drop-shadow(0 0 24px #ffd25a88)">🪄</div>
      <h2 class="title" style="font-size:3rem">Spell Challenge</h2>
      <p class="speech" style="margin:4px 0">“Look at the picture. Say the magic word!”</p>
      <p class="ko">그림을 보고 영어 단어를 말하면 마법이 걸려요! (${ROUND}문제)</p>
      <div class="parchment" style="max-width:820px;margin-top:30px">
        <div class="level-grid">
          <button class="opt level" data-l="beginner"><span class="medal">🧹</span>Beginner<span class="ko">기초 (3~4학년)</span></button>
          <button class="opt level" data-l="advanced"><span class="medal">🐉</span>Advanced<span class="ko">도전 (5~6학년)</span></button>
        </div>
        <div class="seal">S</div>
      </div>
    </div>`;
  Magic.micNotice(app);
  app.querySelectorAll('.level').forEach(b => b.onclick = () => startRound(b.dataset.l));
  Magic.speak('Look at the picture. Say the magic word!');
}

function startRound(l) {
  level = l; list = Magic.shuffle(WORDS[l]).slice(0, ROUND); idx = 0; success = 0;
  Magic.sfx.magic();
  showWord();
}

function starsHtml() {
  return list.map((_, i) => `<span class="${i < success ? '' : 'off'}">⭐</span>`).join('');
}

function showWord() {
  tries = 0; busy = false; turn++;
  Magic.stopListening();
  const W = list[idx];
  app.innerHTML = `
    <div class="pill" style="margin-top:6px">${idx + 1} / ${list.length}</div>
    <div class="stars">${starsHtml()}</div>
    <div class="orb-wrap pop">
      <div class="orb" id="pic"><span class="e">${W.e}</span></div>
      <div class="orb-stand"></div>
    </div>
    <div class="q-line">What is it? <span class="ko">무엇일까요?</span></div>
    <div class="word-box" id="word"></div>
    <div class="listen-row" style="margin-top:4px">
      <button class="speak-btn" id="hint" aria-label="힌트">💡</button>
      <button class="mic" id="mic" aria-label="말하기">🎤</button>
      <button class="speak-btn" id="listen" aria-label="발음 듣기">🔊</button>
    </div>
    <div class="heard" id="heard">🎤를 누르고 말해 보세요. <span class="ko">(💡 힌트 · 🔊 발음 듣기)</span></div>
    <div class="feedback" id="fb"></div>
    <div class="teacher">
      <div class="label">선생님용 · <kbd>Space</kbd> 말하기 <kbd>Enter</kbd> 통과 <kbd>→</kbd> 넘기기</div>
      <div class="row">
        <button class="btn-small btn-ok" id="pass">✔ 통과</button>
        <button class="btn-small" id="skip">➜ 넘기기</button>
      </div>
    </div>`;
  const mic = document.getElementById('mic');
  if (!Magic.canListen) mic.disabled = true;
  mic.onclick = doListen;
  document.getElementById('hint').onclick = () => {
    const w = W.w;
    document.getElementById('word').textContent = w[0].toUpperCase() + ' ' + '_ '.repeat(w.length - 1);
  };
  document.getElementById('listen').onclick = () => {
    document.getElementById('word').textContent = W.w.toUpperCase();
    Magic.speak(W.w);
  };
  document.getElementById('pass').onclick = () => correct(true);
  document.getElementById('skip').onclick = next;
  Magic.speak('What is it?');
}

async function doListen() {
  if (busy) return;
  const W = list[idx];
  const mic = document.getElementById('mic');
  const heard = document.getElementById('heard');
  const fb = document.getElementById('fb');
  busy = true;
  mic.classList.add('listening'); heard.textContent = 'Listening... 🎧'; fb.textContent = '';
  try {
    const my = turn;
    const said = await Magic.listen({ timeout: 5000 });
    if (my !== turn) return;
    mic.classList.remove('listening');
    heard.innerHTML = said.length ? `I heard: <b>${said[0]}</b>` : '잘 안 들렸어요. 조금 더 크게!';
    if (Magic.matchWord(said, W.accept)) return correct(false);
    tries++;
    busy = false;
    fb.className = 'feedback bad'; fb.textContent = 'Try again!';
    Magic.sfx.bad(); Magic.shake(document.getElementById('pic'));
    if (tries === 2) document.getElementById('hint').click();
    if (tries >= 3) document.getElementById('listen').click();
  } catch (e) {
    mic.classList.remove('listening'); busy = false;
    heard.textContent = '마이크 오류: 선생님이 ✔ 통과로 진행해 주세요.';
  }
}

function correct(byTeacher) {
  busy = true;
  const W = list[idx];
  success++;
  Magic.inc('spells');
  document.getElementById('word').textContent = W.w.toUpperCase();
  const fb = document.getElementById('fb');
  fb.className = 'feedback ok'; fb.textContent = '✨ Excellent! ✨';
  document.querySelector('.stars').innerHTML = starsHtml();
  const pic = document.getElementById('pic');
  pic.classList.add('cast');
  Magic.sfx.ok(); Magic.sparkle(pic);
  const article = /^[aeiou]/.test(W.w) ? 'an' : 'a';
  Magic.speak(`Excellent! It's ${article} ${W.w}!`).then(() => setTimeout(next, 300));
}

function next() {
  idx++;
  if (idx < list.length) showWord(); else finish();
}

function finish() {
  Magic.inc('spell_players');
  const msg = success === list.length ? 'Perfect! You are a great wizard!' : success >= 3 ? 'Great job, wizard!' : 'Good try, young wizard!';
  app.innerHTML = `
    <div class="pop" style="margin-top:18px">
      <div class="parchment" style="max-width:640px;margin-top:24px">
        <div style="font-size:5rem">🏅</div>
        <h2 class="q-text">${msg}</h2>
        <div class="stars" style="font-size:3rem">${starsHtml()}</div>
        <p class="fell" style="font-size:1.6rem;margin:6px 0">You cast <b>${success}</b> spells!</p>
        <p class="ko">이제 Forbidden Room으로 이동하세요! ➜</p>
        <div class="seal">S</div>
      </div>
      <button class="btn-magic" id="again" style="margin-top:36px">🪄 Next Student</button>
    </div>`;
  Magic.sfx.magic(); Magic.confetti(); Magic.sparkle(app.querySelector('.parchment'));
  Magic.speak(msg + ` You cast ${success} spells!`);
  document.getElementById('again').onclick = home;
}

// 선생님 단축키
document.addEventListener('keydown', e => {
  if (!document.getElementById('mic') || !list || idx >= list.length) return;
  if (e.code === 'Space') { e.preventDefault(); doListen(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (!busy) correct(true); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); if (!busy) next(); }
});

home();
</script>
</body>
</html>
