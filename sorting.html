<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorting Ceremony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  .crests-row { display: flex; gap: 18px; justify-content: center; margin: 18px 0 26px; }

  /* Your Choice 카드 */
  .houses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; margin: 28px 0 10px; }
  .house-btn { flex-direction: column; gap: 10px; background: transparent; border: none; padding: 8px 4px; position: relative; color: var(--text); }
  .house-btn .crest { transition: transform .2s, box-shadow .2s; }
  .house-btn:hover .crest { transform: translateY(-6px); }
  .house-btn .hname { font-family: "Cinzel", serif; font-weight: 800; font-size: 1.3rem; color: #f6e7c1; }
  .house-btn .trait { font-size: .9rem; color: #cbbd9c; }
  .house-btn.reco .crest { box-shadow: inset 0 0 0 3px #0005, 0 0 0 4px #fbe7a1, 0 0 46px var(--glow); }
  .house-btn .tag { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); z-index: 2; white-space: nowrap;
    font: 800 .8rem "Cinzel", serif; color: #2a1a04; padding: 4px 14px;
    background: linear-gradient(180deg, #fff1b5, #d9a93a); clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); }

  /* 기숙사 깃발 */
  .banner { position: relative; margin: 8px auto 0; width: min(480px, 92vw); padding: 34px 20px 80px;
    background:
      repeating-linear-gradient(90deg, #ffffff08 0 3px, transparent 3px 9px),
      linear-gradient(180deg, var(--c1), var(--c2));
    clip-path: polygon(0 0, 100% 0, 100% 84%, 50% 100%, 0 84%);
    box-shadow: inset 0 0 0 8px var(--metal); }
  .banner-wrap { filter: drop-shadow(0 20px 30px #000c) drop-shadow(0 0 40px var(--glow)); }
  .rod { width: min(500px, 98vw); height: 16px; margin: 0 auto; border-radius: 8px; background: linear-gradient(180deg, #fff1b5, #b8862a 60%, #6e4f22); box-shadow: 0 4px 8px #000a; }
  .house-name { font-family: "Cinzel Decorative", serif; font-weight: 900; font-size: 2.7rem; color: #fff; margin: 10px 0 4px; overflow-wrap: anywhere;
    text-shadow: 0 3px 0 #0007, 0 0 24px var(--glow); }
  .banner .crest { margin: 0 auto; }
  .banner p { color: #fffbe8; margin: 4px 0; }

  @media (max-width: 860px) {
    .houses { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .house-name { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>🕯️ The Sorting Ceremony</h1>
  <div class="tools">
    <a class="btn btn-small" href="index.html">🏠 처음으로</a>
    <button class="btn-small" onclick="Magic.toggleFullscreen()">⛶ 전체화면</button>
  </div>
</div>

<main class="wrap center" id="app"></main>

<script src="assets/common.js"></script>
<script>
const HOUSES = Magic.HOUSES;
const CONFETTI = {
  gryffindor: ['#b3161b', '#e3b23c'], hufflepuff: ['#f0c22a', '#2a2a2a'],
  ravenclaw: ['#1f4fa8', '#b97a3e'], slytherin: ['#1d7a43', '#c9ced6'],
};

// 질문: 그림 보고 고르거나 영어로 말하면 선택됨 (say = 인식할 단어)
const QUESTIONS = [
  { q: 'Which animal do you like?', ko: '어떤 동물을 좋아하나요?', options: [
    { e: '🦁', t: 'Lion', say: ['lion', 'lions', 'line'], h: 'gryffindor' },
    { e: '🦡', t: 'Badger', say: ['badger', 'badgers'], h: 'hufflepuff' },
    { e: '🦅', t: 'Eagle', say: ['eagle', 'eagles', 'bird'], h: 'ravenclaw' },
    { e: '🐍', t: 'Snake', say: ['snake', 'snakes', 'snack'], h: 'slytherin' },
  ]},
  { q: 'Which color do you like?', ko: '어떤 색을 좋아하나요?', options: [
    { e: '🔴', t: 'Red', say: ['red', 'read'], h: 'gryffindor' },
    { e: '🟡', t: 'Yellow', say: ['yellow'], h: 'hufflepuff' },
    { e: '🔵', t: 'Blue', say: ['blue', 'blew'], h: 'ravenclaw' },
    { e: '🟢', t: 'Green', say: ['green'], h: 'slytherin' },
  ]},
  { q: 'What do you like to do?', ko: '무엇을 하는 걸 좋아하나요?', options: [
    { e: '⚽', t: 'Play sports', say: ['sports', 'sport', 'play', 'soccer'], h: 'gryffindor' },
    { e: '🤝', t: 'Help friends', say: ['help', 'friends', 'friend'], h: 'hufflepuff' },
    { e: '📚', t: 'Read books', say: ['read books', 'books', 'book', 'reading'], h: 'ravenclaw' },
    { e: '🏆', t: 'Win games', say: ['win', 'games', 'game', 'winning'], h: 'slytherin' },
  ]},
  { q: 'I want to be ...', ko: '나는 ___ 사람이 되고 싶어요.', options: [
    { e: '💪', t: 'Brave', say: ['brave', 'grave'], h: 'gryffindor' },
    { e: '💛', t: 'Kind', say: ['kind', 'kinda'], h: 'hufflepuff' },
    { e: '🧠', t: 'Smart', say: ['smart'], h: 'ravenclaw' },
    { e: '👑', t: 'The best', say: ['best', 'the best'], h: 'slytherin' },
  ]},
];

// 모자·문장·촛불·꽃가루는 assets/common.js (Magic) 에 있음
const { hatSVG, crest, hatSay } = Magic;
const confetti = h => Magic.confetti(CONFETTI[h]);

// ---------- 화면 흐름 ----------
const app = document.getElementById('app');
let step = 0, score = {}, recommended = null;

function start() {
  document.body.classList.remove('dim');
  step = 0; score = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 }; recommended = null;
  app.innerHTML = `
    <div class="pop" style="margin-top:18px">
      ${hatSVG('big')}
      <h2 class="title" style="font-size:3rem">The Sorting Ceremony</h2>
      <p class="speech" style="margin:6px 0">“Hogwarts has four Houses.<br>Answer my questions, and I will find your House!”</p>
      <p class="ko" style="color:#cbbd9c">호그와트에는 4개의 기숙사가 있어요. 마법의 모자의 질문에 답해 보세요!</p>
      <div class="crests-row">${Object.keys(HOUSES).map(h => crest(h, 'mini')).join('')}</div>
      <button class="btn-magic" id="go">✨ Begin the Ceremony</button>
    </div>`;
  document.getElementById('go').onclick = () => { Magic.sfx.magic(); askQuestion(); };
  hatSay('Welcome to Hogwarts! Hogwarts has four Houses. Answer my questions, and I will find your House!');
}

function askQuestion() {
  const Q = QUESTIONS[step];
  app.innerHTML = `
    <div class="progress">${QUESTIONS.map((_, i) => `<span class="${i <= step ? 'on' : ''}"></span>`).join('')}</div>
    <div class="row" style="align-items:flex-end;gap:0;margin-bottom:-6px">${hatSVG('small')}</div>
    <div class="parchment pop">
      <div class="q-head">
        <h2 class="q-text">${Q.q}</h2>
        <button class="speak-btn" id="replay" aria-label="다시 듣기">🔊</button>
      </div>
      <div class="ko">${Q.ko}</div>
      <div class="options">
        ${Q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="medal">${o.e}</span>${o.t}</button>`).join('')}
      </div>
      <div class="seal">H</div>
    </div>
    <div class="listen-row">
      <button class="mic" id="mic" aria-label="말해서 고르기">🎤</button>
      <div class="hint ko" style="text-align:left">그림을 누르거나<br>🎤를 누르고 영어로 말해 보세요.</div>
    </div>
    <div class="heard" id="heard"></div>`;
  Magic.micNotice(app);
  const read = () => hatSay(Q.q + ' ' + Q.options.map(o => o.t).join(', ') + '?');
  read();
  document.getElementById('replay').onclick = read;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  const mic = document.getElementById('mic');
  if (!Magic.canListen) mic.disabled = true;
  mic.onclick = async () => {
    const heard = document.getElementById('heard');
    mic.classList.add('listening'); heard.textContent = 'Listening... 🎧';
    try {
      const said = await Magic.listen();
      mic.classList.remove('listening');
      const idx = Q.options.findIndex(o => Magic.matchWord(said, o.say));
      heard.innerHTML = said.length ? `I heard: <b>${said[0]}</b>` : '잘 안 들렸어요. 다시 말해 볼까요?';
      if (idx >= 0) choose(idx);
      else { Magic.sfx.bad(); Magic.shake(app.querySelector('.options')); }
    } catch (e) {
      mic.classList.remove('listening');
      heard.textContent = '마이크를 사용할 수 없어요. 그림을 눌러 주세요.';
    }
  };
}

function choose(i) {
  const Q = QUESTIONS[step];
  const o = Q.options[i];
  score[o.h]++;
  const btn = app.querySelector(`.opt[data-i="${i}"]`);
  btn.classList.add('chosen');
  app.querySelectorAll('.opt, #mic').forEach(b => b.disabled = true);
  Magic.sfx.ok(); Magic.sparkle(btn);
  hatSay(o.t + '!');
  setTimeout(() => { step++; step < QUESTIONS.length ? askQuestion() : thinking(); }, 1100);
}

function thinking() {
  const max = Math.max(...Object.values(score));
  const top = Object.keys(score).filter(k => score[k] === max);
  recommended = top[Math.floor(Math.random() * top.length)];
  document.body.classList.add('dim');
  app.innerHTML = `
    <div style="margin-top:50px">
      ${hatSVG('big')}
      <p class="speech" style="font-size:2.4rem;margin:18px 0 4px">“Hmm... Difficult. Very difficult...”</p>
      <p class="ko" style="color:#cbbd9c">마법의 모자가 생각하고 있어요...</p>
    </div>`;
  document.getElementById('hat').classList.add('thinking');
  hatSay('Hmm... difficult. Very difficult... Let me see...', { rate: 0.75 }).then(() => setTimeout(reveal, 400));
}

function bannerHTML(h, top, bottom) {
  const H = HOUSES[h];
  return `
    <div class="banner-wrap h-${h} pop">
      <div class="rod"></div>
      <div class="banner">
        ${top || ''}
        ${crest(h, 'huge')}
        <div class="house-name">${H.name.toUpperCase()}!</div>
        ${bottom || ''}
      </div>
    </div>`;
}

function reveal() {
  document.body.classList.remove('dim');
  const H = HOUSES[recommended];
  Magic.inc('reco_' + recommended);
  app.innerHTML = `
    <div style="margin-top:6px">${hatSVG('small')}</div>
    ${bannerHTML(recommended, '', `<p style="font-size:1.3rem" class="fell">You are <b>${H.trait.toLowerCase()}</b>.</p><p class="ko">${H.ko} 마법사</p>`)}
    <button class="btn-magic" id="next" style="margin-top:22px">Next ➜ Your Choice</button>`;
  Magic.sfx.magic(); confetti(recommended);
  hatSay(H.name + '!', { rate: 0.8, pitch: 1.1 });
  document.getElementById('next').onclick = yourChoice;
}

function yourChoice() {
  app.innerHTML = `
    <h2 class="title" style="font-size:2.6rem;margin:14px 0 2px">Your Choice</h2>
    <p class="speech" style="margin:0">“Which House do you want to join?”</p>
    <p class="ko" style="color:#cbbd9c">모자의 추천은 ⭐ 표시! 하지만 최종 선택은 여러분이 해요.</p>
    <div class="houses">
      ${Object.entries(HOUSES).map(([k, h]) => `
        <button class="house-btn ${k === recommended ? 'reco' : ''}" data-h="${k}">
          ${k === recommended ? '<span class="tag">⭐ The Hat Says</span>' : ''}
          ${crest(k)}
          <span class="hname">${h.name}</span>
          <span class="trait">${h.trait} · ${h.ko}</span>
        </button>`).join('')}
    </div>
    <div class="listen-row">
      <button class="mic" id="mic" aria-label="말해서 고르기">🎤</button>
      <div class="hint ko" style="text-align:left">"I want <b>Gryffindor</b>."<br>처럼 말해도 돼요.</div>
    </div>
    <div class="heard" id="heard"></div>`;
  Magic.speak('Which House do you want to join?');
  app.querySelectorAll('.house-btn').forEach(b => b.onclick = () => welcome(b.dataset.h));
  const mic = document.getElementById('mic');
  if (!Magic.canListen) mic.disabled = true;
  const SAY = {
    gryffindor: ['gryffindor', 'griffindor', 'griffin', 'gryffin', 'lion', 'red'],
    hufflepuff: ['hufflepuff', 'huffle', 'puff', 'badger', 'yellow'],
    ravenclaw: ['ravenclaw', 'raven', 'claw', 'eagle', 'blue'],
    slytherin: ['slytherin', 'slithering', 'slither', 'snake', 'green'],
  };
  mic.onclick = async () => {
    const heard = document.getElementById('heard');
    mic.classList.add('listening'); heard.textContent = 'Listening... 🎧';
    try {
      const said = await Magic.listen();
      mic.classList.remove('listening');
      heard.innerHTML = said.length ? `I heard: <b>${said[0]}</b>` : '잘 안 들렸어요. 다시 말해 볼까요?';
      const h = Object.keys(SAY).find(k => Magic.matchWord(said, SAY[k]));
      if (h) welcome(h); else Magic.sfx.bad();
    } catch (e) { mic.classList.remove('listening'); heard.textContent = '기숙사를 눌러 주세요.'; }
  };
}

function welcome(h) {
  const H = HOUSES[h];
  Magic.inc('house_' + h);
  Magic.inc('sorted');
  app.innerHTML = `
    ${bannerHTML(h, '<p class="fell" style="font-size:1.6rem;margin:0 0 10px">Welcome to</p>', '<p class="ko">이제 Spell Challenge로 이동하세요! ➜</p>')}
    <div class="row" style="margin-top:24px">
      <button class="btn-magic" id="again">🎩 Next Student</button>
    </div>`;
  Magic.sfx.magic(); confetti(h);
  Magic.speak('Welcome to ' + H.name + '! Now, go to the Spell Challenge!');
  document.getElementById('again').onclick = start;
}

start();
</script>
</body>
</html>
