<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Spell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  /* 주문서(양피지)에 적힌 지시문 */
  .cmd { font-family: "IM Fell English", Georgia, serif; font-size: 3.2rem; line-height: 1.25; margin: 0; min-height: 2.6em; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .cmd.blur { filter: blur(14px); }
  .c-red { color: #b3161b; } .c-blue { color: #1f4fa8; } .c-yellow { color: #b8860b; } .c-green { color: #1d7a43; }
  .cmd [class^="c-"] { font-weight: 700; }
  .controls { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 34px; }
  .label-check { display: inline-flex; gap: 8px; align-items: center; margin-top: 18px; color: var(--ink-soft); font-size: .95rem; }
  @media (max-width: 640px) { .cmd { font-size: 1.9rem; } }
</style>
</head>
<body>
<div class="topbar">
  <h1>🥤 The Final Spell</h1>
  <div class="tools">
    <a class="btn btn-small" href="index.html">🏠 처음으로</a>
    <button class="btn-small" onclick="Magic.toggleFullscreen()">⛶ 전체화면</button>
  </div>
</div>

<main class="wrap center" id="app"></main>

<script src="assets/common.js"></script>
<script>
// 컵스택 지시문 (협의안 Final Spell 내용 기반). 한 판 = 순서대로 진행
const SETS = {
  beginner: [
    ['Take the red cup.', 'Put the cup here.', 'Take the blue cup.', 'Put the red cup on the blue cup.', 'Put the yellow cup on top.', 'Build a tower!'],
    ['Take the green cup.', 'Put the cup here.', 'Take the yellow cup.', 'Put the yellow cup on the green cup.', 'Move the green cup.', 'Make a 3-layer tower!'],
    ['Take the blue cup.', 'Put the cup here.', 'Take the red cup.', 'Put the red cup next to the blue cup.', 'Put the green cup on top.', 'Build a tower!'],
  ],
  advanced: [
    ['Take 2 red cups and 3 blue cups.', 'Put the 3 blue cups in a line.', 'Put the 2 red cups on top.', 'Put 1 yellow cup on the top.', 'Make 3 layers!'],
    ['Take 3 green cups and 2 yellow cups.', 'Put the green cups in a line.', 'Put the yellow cups on the green cups.', 'Put 1 red cup on top.', 'Make 3 layers!'],
    ['Take 3 yellow cups.', 'Take 2 blue cups and 1 red cup.', 'Put the yellow cups in a line.', 'Put the blue cups on top.', 'Put the red cup on the very top.', 'Make a pyramid!'],
  ],
};

const app = document.getElementById('app');
let list, i, hideText = false;

function colorize(t) {
  return t.replace(/\b(red|blue|yellow|green)\b/gi, m => `<span class="c-${m.toLowerCase()}">${m}</span>`);
}

function home() {
  app.innerHTML = `
    <div class="pop" style="margin-top:18px">
      <div style="font-size:5.5rem;filter:drop-shadow(0 0 24px #ffd25a88)">🥤🪄</div>
      <h2 class="title" style="font-size:3rem">The Final Spell</h2>
      <p class="speech" style="margin:4px 0">“Listen and build the magic tower!”</p>
      <p class="ko">영어 지시를 듣고 컵을 쌓아요. 원어민 선생님이 없을 때 앱이 대신 읽어 줘요.</p>
      <div class="parchment" style="max-width:820px;margin-top:30px">
        <div class="level-grid">
          <button class="opt level" data-l="beginner"><span class="medal">🥤</span>Beginner<span class="ko">기초</span></button>
          <button class="opt level" data-l="advanced"><span class="medal">🏰</span>Advanced<span class="ko">도전</span></button>
        </div>
        <label class="label-check"><input type="checkbox" id="hide"> 글자 가리기 (듣기만으로 도전)</label>
        <div class="seal">F</div>
      </div>
    </div>`;
  document.getElementById('hide').checked = hideText;
  document.getElementById('hide').onchange = e => hideText = e.target.checked;
  app.querySelectorAll('.level').forEach(b => b.onclick = () => {
    const sets = SETS[b.dataset.l];
    list = sets[Math.floor(Math.random() * sets.length)]; i = 0;
    Magic.sfx.magic(); show();
  });
}

function show() {
  const t = list[i];
  app.innerHTML = `
    <div class="progress" style="margin-top:14px">${list.map((_, k) => `<span class="${k <= i ? 'on' : ''}"></span>`).join('')}</div>
    <div class="pill">Spell ${i + 1} / ${list.length}</div>
    <div class="parchment pop" style="margin-top:30px">
      <div class="cmd ${hideText ? 'blur' : ''}" id="cmd"><span>${colorize(t)}</span></div>
      <div class="seal">F</div>
    </div>
    <div class="controls">
      <button class="btn-big" id="again">🔊 Again</button>
      ${hideText ? '<button class="btn-big" id="reveal">👀 Show</button>' : ''}
      <button class="btn-magic" id="next">${i < list.length - 1 ? 'Next ➜' : '✔ Finish'}</button>
    </div>
    <p class="ko" style="margin-top:16px">선생님: 학생이 지시대로 했으면 Next를 눌러 주세요.</p>`;
  Magic.speak(t, { rate: 0.8 });
  document.getElementById('again').onclick = () => Magic.speak(t, { rate: 0.7 });
  const rv = document.getElementById('reveal');
  if (rv) rv.onclick = () => document.getElementById('cmd').classList.remove('blur');
  document.getElementById('next').onclick = () => {
    Magic.sfx.ok();
    i++;
    i < list.length ? show() : finish();
  };
}

function finish() {
  Magic.inc('final_players');
  app.innerHTML = `
    <div class="pop" style="margin-top:18px">
      ${Magic.hatSVG()}
      <h2 class="title" style="font-size:3rem">Congratulations!</h2>
      <p class="speech" style="margin:4px 0">“You are a real Hogwarts wizard!”</p>
      <p class="ko">House 인증 카드를 받고 포토존으로 가세요! 📸</p>
      <button class="btn-magic" id="again" style="margin-top:22px">🥤 Next Student</button>
    </div>`;
  Magic.sfx.magic(); Magic.confetti(); Magic.sparkle(document.getElementById('hat'), ['🎉', '✨', '⭐']);
  Magic.hatSay('Congratulations! You are a real Hogwarts wizard!');
  document.getElementById('again').onclick = home;
}

home();
</script>
</body>
</html>
