<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Spell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  .level-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; max-width: 760px; margin: 24px auto; }
  .level { flex-direction: column; min-height: 200px; font-size: 1.6rem; font-weight: 800; border-width: 3px; }
  .level .e { font-size: 4rem; }
  .cmd { font-size: 3rem; font-weight: 800; line-height: 1.3; margin: 18px 0; min-height: 2.6em; display: flex; align-items: center; justify-content: center; }
  .cmd.blur { filter: blur(14px); }
  .c-red { color: #ff5c5c; } .c-blue { color: #5ca8ff; } .c-yellow { color: #ffd84a; } .c-green { color: #5cdb7a; }
  .steps { display: flex; gap: 6px; justify-content: center; margin: 8px 0; }
  .steps span { width: 34px; height: 8px; border-radius: 4px; background: #fff3; }
  .steps span.on { background: var(--gold); }
  @media (max-width: 640px) { .cmd { font-size: 1.9rem; } }
</style>
</head>
<body>
<div class="topbar">
  <h1 class="title-font">🥤 Final Spell</h1>
  <div class="tools">
    <a class="btn btn-small" href="index.html">🏠 처음으로</a>
    <button class="btn-small" onclick="Magic.toggleFullscreen()">⛶ 전체화면</button>
  </div>
</div>

<main class="wrap center" id="app"></main>

<script src="assets/common.js"></script>
<script>
// 컵스택 지시문 (협의안 Final Spell 내용 기반). 한 판 = 순서대로 진행
const SETS = {
  beginner: [
    ['Take the red cup.', 'Put the cup here.', 'Take the blue cup.', 'Put the red cup on the blue cup.', 'Put the yellow cup on top.', 'Build a tower!'],
    ['Take the green cup.', 'Put the cup here.', 'Take the yellow cup.', 'Put the yellow cup on the green cup.', 'Move the green cup.', 'Make a 3-layer tower!'],
    ['Take the blue cup.', 'Put the cup here.', 'Take the red cup.', 'Put the red cup next to the blue cup.', 'Put the green cup on top.', 'Build a tower!'],
  ],
  advanced: [
    ['Take 2 red cups and 3 blue cups.', 'Put the 3 blue cups in a line.', 'Put the 2 red cups on top.', 'Put 1 yellow cup on the top.', 'Make 3 layers!'],
    ['Take 3 green cups and 2 yellow cups.', 'Put the green cups in a line.', 'Put the yellow cups on the green cups.', 'Put 1 red cup on top.', 'Make 3 layers!'],
    ['Take 3 yellow cups.', 'Take 2 blue cups and 1 red cup.', 'Put the yellow cups in a line.', 'Put the blue cups on top.', 'Put the red cup on the very top.', 'Make a pyramid!'],
  ],
};

const app = document.getElementById('app');
let list, i, hideText = false;

function colorize(t) {
  return t.replace(/\b(red|blue|yellow|green)\b/gi, m => `<span class="c-${m.toLowerCase()}">${m}</span>`);
}

function home() {
  app.innerHTML = `
    <div class="card pop" style="margin-top:24px">
      <div style="font-size:6rem">🥤🪄</div>
      <h2 class="title-font" style="font-size:2.2rem;margin:6px 0;color:var(--gold)">Final Spell</h2>
      <p style="font-size:1.4rem;margin:4px 0">Listen and build the magic tower!</p>
      <p class="ko">영어 지시를 듣고 컵을 쌓아요. 원어민 선생님이 없을 때 앱이 대신 읽어 줘요.</p>
      <div class="level-grid">
        <button class="level" data-l="beginner"><span class="e">🥤</span>Beginner<span class="ko">기초</span></button>
        <button class="level" data-l="advanced"><span class="e">🏰</span>Advanced<span class="ko">도전</span></button>
      </div>
      <label class="ko"><input type="checkbox" id="hide"> 글자 가리기 (듣기만으로 도전)</label>
    </div>`;
  document.getElementById('hide').checked = hideText;
  document.getElementById('hide').onchange = e => hideText = e.target.checked;
  app.querySelectorAll('.level').forEach(b => b.onclick = () => {
    const sets = SETS[b.dataset.l];
    list = sets[Math.floor(Math.random() * sets.length)]; i = 0;
    Magic.sfx.magic(); show();
  });
}

function show() {
  const t = list[i];
  app.innerHTML = `
    <div class="steps">${list.map((_, k) => `<span class="${k <= i ? 'on' : ''}"></span>`).join('')}</div>
    <div class="pill">Spell ${i + 1} / ${list.length}</div>
    <div class="cmd pop ${hideText ? 'blur' : ''}" id="cmd">${colorize(t)}</div>
    <div class="row">
      <button class="btn-big" id="again">🔊 Again</button>
      ${hideText ? '<button class="btn-big" id="reveal">👀 Show</button>' : ''}
      <button class="btn-gold btn-big" id="next">${i < list.length - 1 ? 'Next ➜' : '✔ Finish'}</button>
    </div>
    <p class="ko" style="margin-top:16px">선생님: 학생이 지시대로 했으면 Next를 눌러 주세요.</p>`;
  Magic.speak(t, { rate: 0.8 });
  document.getElementById('again').onclick = () => Magic.speak(t, { rate: 0.7 });
  const rv = document.getElementById('reveal');
  if (rv) rv.onclick = () => document.getElementById('cmd').classList.remove('blur');
  document.getElementById('next').onclick = () => {
    Magic.sfx.ok();
    i++;
    i < list.length ? show() : finish();
  };
}

function finish() {
  Magic.inc('final_players');
  app.innerHTML = `
    <div class="card pop" style="margin-top:24px">
      <div style="font-size:6rem">🎉🏰</div>
      <h2 class="title-font" style="font-size:2.4rem;color:var(--gold);margin:6px 0">Congratulations!</h2>
      <p style="font-size:1.4rem">You are a real Hogwarts wizard!</p>
      <p class="ko">House 인증 카드를 받고 포토존으로 가세요! 📸</p>
      <button class="btn-gold btn-big" id="again" style="margin-top:14px">🥤 Next Student</button>
    </div>`;
  Magic.sfx.magic(); Magic.sparkle(app.querySelector('.card'), ['🎉', '✨', '⭐']);
  Magic.speak('Congratulations! You are a real Hogwarts wizard!');
  document.getElementById('again').onclick = home;
}

home();
</script>
</body>
</html>
